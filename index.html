<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghost Team</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0a;
  color: white;
  text-align: center;
}

/* TITLE */
h1 {
  margin-top: 60px;
  font-size: 50px;
  text-shadow: 0 0 20px #fff;
}

p {
  color: #aaa;
}

/* LOG BOX */
.logs {
  width: 80%;
  max-width: 800px;
  margin: 40px auto;
  background: #111;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 0 20px rgba(0,255,0,0.2);
  text-align: left;
}

/* HEADER */
.logs h2 {
  text-align: center;
  margin-bottom: 15px;
}

/* LOG TEXT */
pre {
  color: #00ff88;
  font-size: 14px;
  white-space: pre-wrap;
  font-family: monospace;
}

/* SCROLL */
.logs {
  max-height: 400px;
  overflow-y: auto;
}

/* SCROLL STYLE */
.logs::-webkit-scrollbar {
  width: 6px;
}
.logs::-webkit-scrollbar-thumb {
  background: #00ff88;
}
</style>
</head>

<body>

<h1>👻 Ghost Team</h1>
<p>Live Server Logs 🔥</p>

<div class="logs">
  <h2>📊 Logs</h2>
  <pre id="logs">Loading...</pre>
</div>

<script>
const API = "https://hunters.up.railway.app/logs";

function loadLogs() {
  fetch(API)
  .then(res => res.text())
  .then(data => {
    document.getElementById("logs").textContent = data;
  });
}

// أول تحميل
loadLogs();

// تحديث كل 2 ثواني 🔄
setInterval(loadLogs, 2000);
</script>

</body>
</html>
