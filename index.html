<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghost Team</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0a;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 60px;
  font-size: 50px;
  text-shadow: 0 0 20px #fff;
}

p {
  color: #aaa;
}

.logs {
  width: 80%;
  max-width: 800px;
  margin: 40px auto;
  background: #111;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 0 20px rgba(0,255,0,0.2);
  text-align: left;
  max-height: 400px;
  overflow-y: auto;
}

.logs h2 {
  text-align: center;
  margin-bottom: 15px;
}

.log {
  padding: 8px;
  margin-bottom: 5px;
  border-radius: 8px;
  font-family: monospace;
}

.join {
  background: rgba(0,255,100,0.1);
  color: #00ff88;
}

.leave {
  background: rgba(255,0,0,0.1);
  color: #ff4444;
}

</style>
</head>

<body>

<h1>👻 Ghost Team</h1>
<p>Live Server Logs 🔥</p>

<div class="logs">
  <h2>📊 Logs</h2>
  <div id="logs">Loading...</div>
</div>

<script>
const API = "https://hunters.up.railway.app/logs";

function formatLogs(text) {
  let lines = text.split("] ");

  return lines.map(line => {
    if (!line.trim()) return "";

    if (line.includes("JOIN")) {
      return `<div class="log join">🟢 ${line}]</div>`;
    } else if (line.includes("LEAVE")) {
      return `<div class="log leave">🔴 ${line}]</div>`;
    } else {
      return `<div class="log">${line}]</div>`;
    }
  }).join("");
}

function loadLogs() {
  fetch(API)
  .then(res => res.text())
  .then(data => {
    document.getElementById("logs").innerHTML = formatLogs(data);
  });
}

loadLogs();
setInterval(loadLogs, 2000);
</script>

</body>
</html>
