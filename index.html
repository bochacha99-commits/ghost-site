<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ghost Team</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(270deg, #000, #111, #000);
  background-size: 600% 600%;
  animation: bg 10s ease infinite;
  color: white;
  text-align: center;
}

@keyframes bg {
  0% {background-position:0%}
  50% {background-position:100%}
  100% {background-position:0%}
}

.container {
  margin-top: 80px;
}

h1 {
  font-size: 60px;
  text-shadow: 0 0 20px #fff;
}

.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 25px;
  background: #5865F2;
  border-radius: 12px;
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
}

.logs-box {
  margin: 50px auto;
  width: 80%;
  max-width: 700px;
  background: #111;
  padding: 20px;
  border-radius: 15px;
  text-align: left;
  box-shadow: 0 0 15px #000;
}

.logs-box h2 {
  text-align: center;
}

pre {
  white-space: pre-wrap;
  color: #0f0;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
  <h1>👻 Ghost Team</h1>
  <p>Best Moroccan Community 🔥</p>
  <a href="https://discord.gg/FrRSUKDG" class="btn">Join Discord</a>
</div>

<div class="logs-box">
  <h2>📊 Live Server Logs</h2>
  <pre id="logs">Loading...</pre>
</div>

<script>
const API = "https://hunters.up.railway.app/logs";

function loadLogs() {
  fetch(API)
    .then(res => res.text())
    .then(data => {
      document.getElementById("logs").textContent = data;
    });
}

// 🔄 تحديث كل 3 ثواني (LIVE)
setInterval(loadLogs, 3000);

// أول تحميل
loadLogs();
</script>

</body>
</html>
